<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Room Directory</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --teal:#0d9488; --teal-dark:#0f766e; --teal-light:#14b8a6;
  --teal-pale:#ccfbf1; --teal-xpale:#f0fdfa;
  --white:#ffffff; --off:#f8fffe;
  --text:#0f2f2c; --text2:#2d6b65; --text3:#6aada7;
  --border:#b2e4de; --border2:#d1f5f0;
  --shadow:rgba(13,148,136,0.12); --shadow2:rgba(13,148,136,0.22);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--text);min-height:100vh;}

header{background:var(--white);border-bottom:2px solid var(--border);padding:0 2rem;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px var(--shadow);}
.hdr{max-width:1300px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:1rem 0;}
.logo{display:flex;align-items:center;gap:.8rem;}
.logo-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--teal),var(--teal-light));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;box-shadow:0 4px 14px var(--shadow2);}
.logo-text h1{font-family:'DM Serif Display',serif;font-size:1.3rem;color:var(--text);}
.logo-text p{font-size:.7rem;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;}
.kpis{display:flex;gap:2rem;}
.kpi{text-align:center;}
.kpi .n{font-family:'DM Serif Display',serif;font-size:1.5rem;color:var(--teal);}
.kpi .l{font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;}

.search-band{background:linear-gradient(135deg,var(--teal-dark),var(--teal),var(--teal-light));padding:2.2rem 2rem 3.2rem;position:relative;overflow:hidden;}
.search-band::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:36px;background:var(--off);clip-path:ellipse(55% 100% at 50% 100%);}
.s-inner{max-width:680px;margin:0 auto;position:relative;z-index:1;}
.s-title{font-family:'DM Serif Display',serif;font-size:1.6rem;color:#fff;text-align:center;margin-bottom:1rem;font-style:italic;}
.s-box{position:relative;}
.s-box input{width:100%;padding:.95rem 3.2rem .95rem 3rem;background:#fff;border:none;border-radius:50px;font-size:1rem;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;box-shadow:0 8px 28px rgba(0,0,0,.18);}
.s-box input:focus{box-shadow:0 8px 28px rgba(0,0,0,.22),0 0 0 3px rgba(255,255,255,.3);}
.s-box input::placeholder{color:var(--text3);}
.s-ico{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--teal);font-size:1rem;}
.s-clr{position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:.95rem;display:none;}
.s-clr:hover{color:var(--teal);}

#flashWrap{max-width:1300px;margin:0 auto;padding:0 2rem;display:none;}
.flash-card{background:#fff;border:2px solid var(--teal-light);border-radius:16px;padding:1.3rem 1.8rem;display:flex;align-items:center;gap:1.6rem;margin-top:-.8rem;box-shadow:0 8px 28px var(--shadow2);animation:popIn .35s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;}
.flash-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--teal-light),var(--teal-dark));}
@keyframes popIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
.f-badge{width:72px;height:72px;flex-shrink:0;background:linear-gradient(135deg,var(--teal),var(--teal-light));border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 14px var(--shadow2);}
.f-badge .fn{font-family:'DM Serif Display',serif;font-size:1.4rem;line-height:1;}
.f-badge .fl{font-size:.5rem;text-transform:uppercase;letter-spacing:1px;opacity:.8;}
.f-info{flex:1;}
.f-found{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--teal);font-weight:600;margin-bottom:2px;}
.f-name{font-family:'DM Serif Display',serif;font-size:1.4rem;color:var(--text);}
.f-tags{display:flex;gap:.5rem;margin-top:.4rem;flex-wrap:wrap;}
.ftag{padding:.22rem .7rem;border-radius:20px;font-size:.73rem;font-weight:600;}
.ftag.b{background:var(--teal-pale);color:var(--teal-dark);}
.ftag.f{background:#fef9c3;color:#854d0e;}
.ftag.c{background:#ede9fe;color:#6b21a8;}

#multiWrap{display:none;max-width:1300px;margin:0 auto;padding:0 2rem;margin-top:-.4rem;}
.m-label{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:.5rem;}
.m-grid{display:flex;gap:.5rem;flex-wrap:wrap;}
.mini-card{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:.7rem 1rem;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:.7rem;}
.mini-card:hover{border-color:var(--teal);box-shadow:0 4px 14px var(--shadow);}
.m-badge{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--teal),var(--teal-light));}
.m-name{font-weight:600;font-size:.83rem;color:var(--text);}
.m-sub{font-size:.7rem;color:var(--text3);}

#noResult{display:none;max-width:1300px;margin:0 auto;padding:0 2rem;margin-top:-.4rem;}
.no-box{background:#fff;border:1.5px solid var(--border2);border-radius:12px;padding:1rem 1.4rem;text-align:center;color:var(--text3);}

.main{max-width:1300px;margin:0 auto;padding:1.8rem 2rem 6rem;}
.view-tabs{display:flex;gap:.4rem;margin-bottom:1.6rem;border-bottom:2px solid var(--border2);}
.tab-btn{padding:.5rem 1.2rem;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:.85rem;font-weight:600;color:var(--text3);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-2px;transition:all .2s;border-radius:6px 6px 0 0;}
.tab-btn:hover{color:var(--teal);}
.tab-btn.active{color:var(--teal-dark);border-bottom-color:var(--teal);background:rgba(13,148,136,.05);}

/* ===== ACCORDION ===== */
.dash-sec{margin-bottom:.75rem;}

.acc-hdr{
  display:flex;align-items:center;gap:.9rem;
  padding:1rem 1.4rem;
  background:#fff;
  border:1.5px solid var(--border2);
  border-radius:14px;
  cursor:pointer;
  user-select:none;
  transition:background .2s, border-color .2s, box-shadow .2s, border-radius .2s;
}
.acc-hdr:hover{
  border-color:var(--teal-light);
  box-shadow:0 4px 16px var(--shadow);
  background:var(--teal-xpale);
}
.acc-hdr.is-open{
  background:var(--teal-xpale);
  border-color:var(--teal);
  border-bottom-color:transparent;
  border-radius:14px 14px 0 0;
}
.acc-icon{width:36px;height:36px;border-radius:10px;background:var(--teal-pale);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;transition:background .2s;}
.acc-hdr.is-open .acc-icon{background:rgba(13,148,136,.18);}
.acc-label{font-family:'DM Serif Display',serif;font-size:1.05rem;color:var(--text);flex:1;}
.acc-count{font-size:.73rem;color:var(--teal-dark);background:var(--teal-pale);padding:.18rem .65rem;border-radius:20px;font-weight:700;}
.acc-arrow{font-size:.75rem;color:var(--text3);transition:transform .3s cubic-bezier(.34,1.56,.64,1), color .2s;flex-shrink:0;}
.acc-hdr.is-open .acc-arrow{transform:rotate(180deg);color:var(--teal);}

.acc-body{
  max-height:0;
  overflow:hidden;
  transition:max-height .45s cubic-bezier(.4,0,.2,1);
  background:#fff;
  border:0 solid var(--teal);
  border-top:none;
  border-radius:0 0 14px 14px;
}
.acc-body.is-open{
  max-height:4000px;
  border-width:1.5px;
}
.acc-inner{padding:1rem;}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.65rem;}
.cat-card{background:var(--off);border:1.5px solid var(--border2);border-radius:12px;padding:.9rem 1.1rem;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.cat-card:hover{border-color:var(--teal-light);box-shadow:0 4px 14px var(--shadow);transform:translateY(-2px);background:#fff;}
.cat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--teal-light),var(--teal));opacity:0;transition:opacity .2s;}
.cat-card:hover::before{opacity:1;}
.cc-no{font-family:'DM Serif Display',serif;font-size:1rem;color:var(--teal-dark);margin-bottom:.18rem;}
.cc-name{font-size:.8rem;color:var(--text);font-weight:500;line-height:1.35;}
.cc-meta{font-size:.67rem;color:var(--text3);margin-top:.28rem;}
.btag{display:inline-block;padding:.16rem .5rem;border-radius:5px;font-size:.7rem;font-weight:700;background:var(--teal-pale);color:var(--teal-dark);}

#tableView{display:none;}
.tbl-box{background:#fff;border-radius:14px;border:1.5px solid var(--border2);overflow:hidden;box-shadow:0 2px 14px var(--shadow);}
.tbl-top{padding:.85rem 1.4rem;background:var(--teal-xpale);border-bottom:1.5px solid var(--border2);display:flex;align-items:center;justify-content:space-between;}
.tbl-top span{font-size:.78rem;color:var(--teal-dark);font-weight:600;}
.tscroll{max-height:520px;overflow-y:auto;}
.tscroll::-webkit-scrollbar{width:5px;}
.tscroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
table{width:100%;border-collapse:collapse;}
thead th{position:sticky;top:0;background:#fff;padding:.65rem 1.2rem;text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:1.2px;color:var(--text3);font-weight:700;border-bottom:1.5px solid var(--border2);}
tbody tr{border-bottom:1px solid var(--border2);transition:background .15s;cursor:pointer;}
tbody tr:hover{background:var(--teal-xpale);}
tbody td{padding:.65rem 1.2rem;font-size:.85rem;}
.td-r{font-family:'DM Serif Display',serif;font-size:.95rem;color:var(--teal-dark);}
.td-n{color:var(--text);font-weight:500;}
.cpill{display:inline-block;padding:.16rem .5rem;border-radius:5px;font-size:.7rem;font-weight:600;}
.type-lab{background:#dcfce7;color:#14532d;}
.type-class{background:#dbeafe;color:#1e3a8a;}
.type-office{background:#fef3c7;color:#78350f;}
.type-faculty{background:#fce7f3;color:#831843;}
.type-hall{background:#ede9fe;color:#4c1d95;}
.type-wash{background:#e0f2fe;color:#0c4a6e;}
.type-store{background:#fee2e2;color:#7f1d1d;}
.type-misc{background:#f1f5f9;color:#475569;}
.flrtag{display:inline-block;padding:.16rem .5rem;border-radius:5px;font-size:.7rem;font-weight:600;background:#fef9c3;color:#854d0e;}

mark{background:rgba(13,148,136,.18);color:var(--teal-dark);border-radius:3px;padding:0 2px;}

.float-btns{position:fixed;bottom:1.8rem;right:1.8rem;display:flex;flex-direction:column;gap:.6rem;z-index:200;}
.fb{width:56px;height:56px;border-radius:50%;border:none;font-family:'DM Serif Display',serif;font-size:.9rem;font-weight:700;cursor:pointer;box-shadow:0 5px 20px rgba(0,0,0,.18);transition:all .25s;position:relative;}
.fb-ab1{background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;}
.fb-ab2{background:#fff;color:var(--teal-dark);border:2.5px solid var(--teal-light);}
.fb.active-f{box-shadow:0 5px 20px var(--shadow2),0 0 0 4px var(--teal-pale);transform:scale(1.08);}
.fb:hover{transform:scale(1.1);}
.fb-tip{position:absolute;right:64px;top:50%;transform:translateY(-50%);background:var(--text);color:#fff;padding:.28rem .65rem;border-radius:7px;font-size:.68rem;font-family:'DM Sans',sans-serif;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;}
.fb-tip::after{content:'';position:absolute;left:100%;top:50%;transform:translateY(-50%);border:5px solid transparent;border-left-color:var(--text);}
.fb:hover .fb-tip{opacity:1;}

@media(max-width:768px){
  .kpis{display:none;}
  .main{padding:1.4rem 1rem 6rem;}
  .search-band{padding:1.8rem 1rem 3rem;}
  #flashWrap,#multiWrap,#noResult{padding:0 1rem;}
  .cat-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="logo">
      <div class="logo-mark">🏛️</div>
      <div class="logo-text">
        <h1>Room Directory</h1>
        <p>Academic Blocks AB-1 &amp; AB-2</p>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="n" id="kTotal">—</div><div class="l">Total</div></div>
      <div class="kpi"><div class="n" id="kLabs">—</div><div class="l">Labs</div></div>
      <div class="kpi"><div class="n" id="kClass">—</div><div class="l">Classrooms</div></div>
      <div class="kpi"><div class="n" id="kOffice">—</div><div class="l">Offices</div></div>
    </div>
  </div>
</header>

<div class="search-band">
  <div class="s-inner">
    <div class="s-title">Find any room instantly</div>
    <div class="s-box">
      <span class="s-ico">🔍</span>
      <input type="text" id="sInput" placeholder="Room no. or name — e.g. 301, G 103, Lab, Seminar…" autocomplete="off" spellcheck="false"/>
      <button class="s-clr" id="sClear">✕</button>
    </div>
  </div>
</div>

<div id="flashWrap">
  <div class="flash-card">
    <div class="f-badge"><div class="fn" id="fNo"></div><div class="fl">Room</div></div>
    <div class="f-info">
      <div class="f-found">✓ Room Located</div>
      <div class="f-name" id="fName"></div>
      <div class="f-tags">
        <span class="ftag b" id="fBldg"></span>
        <span class="ftag f" id="fFlr"></span>
        <span class="ftag c" id="fCat"></span>
      </div>
    </div>
  </div>
</div>

<div id="multiWrap">
  <div class="m-label" id="mLabel"></div>
  <div class="m-grid" id="mGrid"></div>
</div>

<div id="noResult"><div class="no-box" id="noBox"></div></div>

<div class="main">
  <div class="view-tabs">
    <button class="tab-btn active" onclick="switchView('dash',this)">📊 Dashboard</button>
    <button class="tab-btn" onclick="switchView('table',this)">📋 All Rooms</button>
  </div>

  <div id="dashView">
    <div id="catSections"></div>
  </div>

  <div id="tableView">
    <div class="tbl-box">
      <div class="tbl-top">
        <span id="tblTitle">🟢 All Rooms</span>
        <span id="tblCount"></span>
      </div>
      <div class="tscroll">
        <table>
          <thead><tr>
            <th>Room No.</th><th>Name / Area</th><th>Category</th><th>Building</th><th>Floor</th>
          </tr></thead>
          <tbody id="tBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="float-btns">
  <button class="fb fb-ab1" id="fbAB1" onclick="filterBuilding('AB-1',this)">AB1<span class="fb-tip">Academic Block 1</span></button>
  <button class="fb fb-ab2" id="fbAB2" onclick="filterBuilding('AB-2',this)">AB2<span class="fb-tip">Academic Block 2</span></button>
</div>

function categorize(r){
  const n=r.room_name.toLowerCase();
  if(/lab|laboratory|workshop|facility|studio|arena/.test(n)) return 'Lab';
  if(/classroom|class room|horseshoe|smart class|smartclass/.test(n)) return 'Classroom';
  if(/washroom|restroom|toilet/.test(n)) return 'Washroom';
  if(/faculty room/.test(n)) return 'Faculty Room';
  if(/office|cabin|director|hod|department|exam cell|caia|cgc|cats|nss|it manager|marketing|admission|purchase/.test(n)) return 'Office';
  if(/seminar|auditorium|hall|board room|boardroom|discussion room|dining/.test(n)) return 'Hall';
  if(/store|storage|housekeeping|uniform/.test(n)) return 'Store';
  return 'Other';
}

const CATS={
  'Lab':         {icon:'🔬',pill:'type-lab'},
  'Classroom':   {icon:'🏫',pill:'type-class'},
  'Office':      {icon:'🏢',pill:'type-office'},
  'Faculty Room':{icon:'👨\u200d🏫',pill:'type-faculty'},
  'Hall':        {icon:'🎭',pill:'type-hall'},
  'Washroom':    {icon:'🚻',pill:'type-wash'},
  'Store':       {icon:'📦',pill:'type-store'},
  'Other':       {icon:'📌',pill:'type-misc'},
};
const CAT_ORDER=['Lab','Classroom','Hall','Office','Faculty Room','Store','Washroom','Other'];
const enriched=ROOMS.map(r=>({...r,category:categorize(r)}));

let activeBuilding='both', currentView='dash', debounce=null;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function highlight(t,q){if(!q)return esc(t);return esc(t).replace(new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi'),'<mark>$1</mark>');}

function updateKPIs(rooms){
  document.getElementById('kTotal').textContent=rooms.length;
  document.getElementById('kLabs').textContent=rooms.filter(r=>r.category==='Lab').length;
  document.getElementById('kClass').textContent=rooms.filter(r=>r.category==='Classroom').length;
  document.getElementById('kOffice').textContent=rooms.filter(r=>r.category==='Office').length;
}

function getVisible(){
  return activeBuilding==='both'?enriched:enriched.filter(r=>r.building===activeBuilding);
}

function doFlash(r){
  document.getElementById('fNo').textContent=r.room_no;
  document.getElementById('fName').textContent=r.room_name;
  document.getElementById('fBldg').textContent=r.building;
  document.getElementById('fFlr').textContent=r.floor;
  document.getElementById('fCat').textContent=r.category;
  var fw=document.getElementById('flashWrap');
  fw.style.display='block';
  var fc=fw.querySelector('.flash-card');
  fc.style.animation='none';fc.offsetWidth;fc.style.animation='popIn .35s cubic-bezier(.34,1.56,.64,1)';
  document.getElementById('multiWrap').style.display='none';
  document.getElementById('noResult').style.display='none';
  fw.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function toggleAcc(id){
  var body=document.getElementById('body_'+id);
  var hdr=document.getElementById('hdr_'+id);
  var open=body.classList.contains('is-open');
  body.classList.toggle('is-open',!open);
  hdr.classList.toggle('is-open',!open);
}

function renderDash(rooms){
  if(!rooms) rooms=getVisible();
  updateKPIs(rooms);
  var html='';
  CAT_ORDER.forEach(function(cat){
    var cr=rooms.filter(function(r){return r.category===cat;});
    if(!cr.length) return;
    var meta=CATS[cat];
    var id=cat.replace(/\s+/g,'_');
    var cards=cr.map(function(r){
      var d=JSON.stringify(r).replace(/'/g,"\\'");
      return '<div class="cat-card" onclick="doFlash('+d+')">'
        +'<div class="cc-no">'+esc(r.room_no)+'</div>'
        +'<div class="cc-name">'+esc(r.room_name)+'</div>'
        +'<div class="cc-meta"><span class="btag">'+esc(r.building)+'</span> '+esc(r.floor)+'</div>'
        +'</div>';
    }).join('');
    html+='<div class="dash-sec">'
      +'<div class="acc-hdr" id="hdr_'+id+'" onclick="toggleAcc(\''+id+'\')">'
      +'<div class="acc-icon">'+meta.icon+'</div>'
      +'<span class="acc-label">'+cat+'s</span>'
      +'<span class="acc-count">'+cr.length+'</span>'
      +'<span class="acc-arrow">▼</span>'
      +'</div>'
      +'<div class="acc-body" id="body_'+id+'">'
      +'<div class="acc-inner"><div class="cat-grid">'+cards+'</div></div>'
      +'</div>'
      +'</div>';
  });
  document.getElementById('catSections').innerHTML=html;
}

function renderTable(rooms,q){
  q=q||'';
  document.getElementById('tblCount').textContent=rooms.length+' rooms';
  document.getElementById('tBody').innerHTML=rooms.map(function(r){
    var meta=CATS[r.category]||CATS['Other'];
    return '<tr onclick="doFlash('+JSON.stringify(r).replace(/"/g,'&quot;')+')">'
      +'<td class="td-r">'+highlight(r.room_no,q)+'</td>'
      +'<td class="td-n">'+highlight(r.room_name,q)+'</td>'
      +'<td><span class="cpill '+meta.pill+'">'+meta.icon+' '+r.category+'</span></td>'
      +'<td><span class="btag">'+esc(r.building)+'</span></td>'
      +'<td><span class="flrtag">'+esc(r.floor)+'</span></td>'
      +'</tr>';
  }).join('');
}

function switchView(v,btn){
  currentView=v;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  document.getElementById('dashView').style.display=v==='dash'?'block':'none';
  document.getElementById('tableView').style.display=v==='table'?'block':'none';
  var rooms=getVisible();
  if(v==='table') renderTable(rooms,''); else renderDash(rooms);
}

function filterBuilding(b,btn){
  activeBuilding=activeBuilding===b?'both':b;
  document.querySelectorAll('.fb').forEach(function(x){x.classList.remove('active-f');});
  if(activeBuilding!=='both') btn.classList.add('active-f');
  document.getElementById('tblTitle').textContent=activeBuilding==='both'?'🟢 All Rooms':'🟢 '+activeBuilding;
  document.getElementById('flashWrap').style.display='none';
  document.getElementById('multiWrap').style.display='none';
  document.getElementById('noResult').style.display='none';
  document.getElementById('sInput').value='';
  document.getElementById('sClear').style.display='none';
  var rooms=getVisible();
  if(currentView==='dash') renderDash(rooms); else renderTable(rooms,'');
}

function doSearch(val){
  var q=val.trim();
  var fw=document.getElementById('flashWrap');
  var mw=document.getElementById('multiWrap');
  var nr=document.getElementById('noResult');
  document.getElementById('sClear').style.display=q?'block':'none';
  if(!q){
    fw.style.display=mw.style.display=nr.style.display='none';
    var rooms=getVisible();
    if(currentView==='dash') renderDash(rooms); else renderTable(rooms,'');
    return;
  }
  var ql=q.toLowerCase().replace(/\s+/g,'');
  var exact=enriched.filter(function(r){return r.room_no.toLowerCase().replace(/\s+/g,'')==ql;});
  var partial=enriched.filter(function(r){
    return r.room_no.toLowerCase().includes(q.toLowerCase())||r.room_name.toLowerCase().includes(q.toLowerCase());
  });
  if(exact.length===1){
    doFlash(exact[0]);mw.style.display=nr.style.display='none';
  } else if(exact.length>1){
    fw.style.display='none';nr.style.display='none';mw.style.display='block';
    document.getElementById('mLabel').textContent=exact.length+' matches — tap to select';
    document.getElementById('mGrid').innerHTML=exact.map(function(r){
      return '<div class="mini-card" onclick="doFlash('+JSON.stringify(r).replace(/"/g,'&quot;')+')">'
        +'<div class="m-badge">'+esc(r.room_no)+'</div>'
        +'<div><div class="m-name">'+esc(r.room_name)+'</div><div class="m-sub">'+esc(r.building)+' · '+esc(r.floor)+'</div></div>'
        +'</div>';
    }).join('');
  } else if(!partial.length){
    fw.style.display=mw.style.display='none';nr.style.display='block';
    document.getElementById('noBox').textContent='No rooms found for "'+q+'"';
  } else {
    fw.style.display=mw.style.display=nr.style.display='none';
  }
  if(currentView==='table') renderTable(partial,q); else renderDash(partial);
}

document.getElementById('sInput').addEventListener('input',function(e){clearTimeout(debounce);debounce=setTimeout(function(){doSearch(e.target.value);},150);});
document.getElementById('sInput').addEventListener('keydown',function(e){if(e.key==='Escape'){document.getElementById('sInput').value='';doSearch('');}});
document.getElementById('sClear').addEventListener('click',function(){document.getElementById('sInput').value='';doSearch('');});

renderDash();
</script>
